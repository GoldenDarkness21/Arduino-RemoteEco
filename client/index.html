<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CONTROLLER</title>
  <style>
    :root {
      /* Palette */
      --olive: #585123;
      --sand: #eec170;
      --peach: #f2a65a;
      --coral: #f58549;
      --russet: #772f1a;

      /* Derived UI tokens */
      --bg: #fff8ee;
      --card: #fffaf3;
      --accent: var(--coral);
      --text: #3a2c23;
      --soft-shadow: 10px 10px 20px rgba(194, 170, 145, 0.35), -10px -10px 20px rgba(255, 255, 255, 0.9);
      --inset-shadow: inset 8px 8px 16px rgba(194, 170, 145, 0.35), inset -8px -8px 16px rgba(255, 255, 255, 0.95);
    }
    * { box-sizing: border-box; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 860px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    h1 {
      grid-column: 1 / -1;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .2px;
      margin: 0 0 6px 0;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--soft-shadow);
      padding: 18px;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .label {
      font-weight: 600;
      opacity: .8;
      min-width: 120px;
    }
    /* Color input */
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 56px;
      height: 36px;
      border-radius: 12px;
      box-shadow: var(--inset-shadow), var(--soft-shadow);
      padding: 0;
      background: var(--card);
      cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 12px;
    }
    /* Range slider */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--sand) 0%, var(--peach) 60%, #ffe7d6 100%);
      box-shadow: var(--inset-shadow);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--card);
      box-shadow: 4px 4px 10px rgba(163,177,198,.6), -4px -4px 10px rgba(255,255,255,.9);
      border: 3px solid #fff2e3;
      cursor: pointer;
    }
    .value-pill {
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--card);
      box-shadow: var(--soft-shadow);
      font-weight: 700;
      min-width: 36px;
      text-align: center;
    }
    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 16px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffe1bd 0%, #fff2e2 100%);
      box-shadow: var(--inset-shadow);
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--peach) 0%, var(--coral) 55%, var(--russet) 100%);
      border-radius: 999px;
      transition: width .2s ease-out;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-weight: 600;
      opacity: .9;
    }
    .preview {
      width: 40px; height: 40px; border-radius: 12px;
      box-shadow: var(--soft-shadow);
      border: 3px solid #f8fbff;
      background: #000;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>CONTROLLER</h1>

    <div class="card">
      <div class="control-row" style="margin-bottom: 12px;">
        <div class="label">RGB color</div>
        <input id="rgb-input" type="color" value="#000000" />
        <div id="color-preview" class="preview"></div>
      </div>
    </div>

    <div class="card">
      <div class="control-row">
        <div class="label">Green LEDs</div>
        <input id="green-count" type="range" min="0" max="3" step="1" value="0" />
        <span id="green-count-value" class="value-pill">0</span>
      </div>
    </div>

    <div class="card">
      <div class="control-row" style="margin-bottom: 12px;">
        <div class="label">Photoresistor</div>
        <span id="ldr-value" class="value-pill">0</span>
      </div>
      <div class="progress-track">
        <div id="ldr-fill" class="progress-fill"></div>
      </div>
      <div class="progress-meta">
        <span>0%</span>
        <span id="ldr-percent">0%</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="index.js"></script>
</body>

</html>
